<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедГид — Доступные инструкции к лекарствам</title>
    <style>
        :root {
            --scale: 1;
            --primary: #0b5ed7;
            --primary-dark: #084298;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #eef2f6;
            color: #111827;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            line-height: 1.5;
        }
        .layout {
            max-width: 980px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 20px;
            align-items: start;
        }
        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: #ffffff;
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-bottom: 3px solid #e2e8f0;
            padding-bottom: 14px;
            margin-bottom: 16px;
        }
        .logo {
            font-size: calc(23px * var(--scale));
            font-weight: 900;
            color: var(--primary);
            margin: 0;
        }
        .controls {
            display: flex;
            gap: 6px;
        }
        .ctrl-btn {
            padding: 8px 12px;
            font-size: calc(15px * var(--scale));
            font-weight: 800;
            border: 2px solid var(--primary);
            background: #ffffff;
            color: var(--primary);
            border-radius: 10px;
            cursor: pointer;
        }
        .ctrl-btn.active {
            background: var(--primary);
            color: #ffffff;
        }
        .search-input {
            width: 100%;
            padding: 14px 16px;
            font-size: calc(17px * var(--scale));
            border: 3px solid #cbd5e1;
            border-radius: 12px;
            margin-bottom: 14px;
            font-weight: 600;
            outline: none;
        }
        .search-input:focus {
            border-color: var(--primary);
        }
        .med-list {
            display: grid;
            gap: 10px;
            max-height: 440px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .med-btn {
            padding: 14px 16px;
            font-size: calc(17px * var(--scale));
            font-weight: 800;
            background: #eff6ff;
            border: 2px solid #bfdbfe;
            border-radius: 14px;
            color: var(--primary-dark);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            transition: 0.15s;
        }
        .med-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }
        .tag {
            font-size: calc(12px * var(--scale));
            padding: 4px 10px;
            border-radius: 12px;
            background: #ffffff;
            color: var(--primary-dark);
            white-space: nowrap;
            margin-left: 8px;
            font-weight: 800;
        }
        h2 {
            font-size: calc(26px * var(--scale));
            margin: 0 0 6px 0;
            color: #0f172a;
        }
        .subtitle {
            font-size: calc(15px * var(--scale));
            color: #64748b;
            font-weight: 700;
            margin: 0 0 18px 0;
        }
        .section-card {
            background: #f8fafc;
            padding: 18px;
            border-radius: 16px;
            border: 2px solid #e2e8f0;
            margin-bottom: 16px;
        }
        .section-card.dosage {
            background: #fefce8;
            border-color: #fde047;
        }
        .section-label {
            font-size: calc(15px * var(--scale));
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 900;
            margin-bottom: 8px;
        }
        .section-card.dosage .section-label {
            color: #854d0e;
        }
        .section-text {
            font-size: calc(19px * var(--scale));
            margin: 0;
            font-weight: 500;
            color: #1e293b;
        }
        .disclaimer {
            text-align: center;
            font-size: calc(13px * var(--scale));
            color: #64748b;
            margin-top: 14px;
        }
    </style>
</head>

    function normalizeText(str) {
        return str.toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9\s]/g, '');
    }

    function handleSearch() {
        const query = normalizeText(document.getElementById('search-box').value).trim();
        if (query.length >= 3) {
            const words = query.split(/\s+/).filter(w => w.length >= 3);
            const foundIndex = medicines.findIndex(item => {
                const haystack = normalizeText(item[currentLang].name + ' ' + item.keys);
                return words.some(w => haystack.includes(w.slice(0, Math.max(4, w.length - 1))));
            });
            if (foundIndex !== -1) {
                selectedIdx = foundIndex;
            }
        }
        renderApp();
    }

    function changeFont(delta) {
        fontScale = Math.min(1.4, Math.max(0.85, fontScale + delta));
        document.documentElement.style.setProperty('--scale', fontScale);
    }

    function setLang(lang) {
        currentLang = lang;
        renderApp();
    }

    function renderApp() {
        const u = uiText[currentLang];
        const currentMed = medicines[selectedIdx][currentLang];
        const query = normalizeText(document.getElementById('search-box').value).trim();
        const words = query.split(/\s+/).filter(w => w.length >= 3);
        const listBox = document.getElementById('med-list');

        document.getElementById('ui-title').textContent = u.title;
        document.getElementById('search-box').placeholder = u.search;
        document.getElementById('lbl-info').textContent = u.infoLabel;
        document.getElementById('lbl-how').textContent = u.howLabel;
        document.getElementById('ui-disc').textContent = u.disc;

        document.getElementById('med-name').textContent = currentMed.name;
        document.getElementById('med-sub').textContent = currentMed.sub;
        document.getElementById('txt-info').textContent = currentMed.info;
        document.getElementById('txt-how').textContent = currentMed.how;

        document.getElementById('btn-ru').className = 'ctrl-btn' + (currentLang === 'ru' ? ' active' : '');
        document.getElementById('btn-en').className = 'ctrl-btn' + (currentLang === 'en' ? ' active' : '');

        listBox.innerHTML = '';
        medicines.forEach((item, index) => {

<script>
function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlightText(text, rawQuery) {
    const cleanQ = rawQuery.trim();
    if (cleanQ.length < 2) {
        return text;
    }
    const tokens = cleanQ.split(/\s+/).filter(t => t.length >= 2);
    if (tokens.length === 0) {
        return text;
    }
    const pattern = new RegExp('(' + tokens.map(escapeRegExp).join('|') + ')', 'gi');
    return text.replace(pattern, '<mark class="hl-match">$1</mark>');
}

function checkSubstringMatch(item, lang, rawQuery) {
    const q = normalizeText(rawQuery).trim();
    if (!q) {
        return true;
    }
    const data = item[lang];
    const fullText = normalizeText(data.name + ' ' + item.keys);
    const tokens = q.split(/\s+/).filter(t => t.length >= 2);
    if (tokens.length === 0) {
        return fullText.includes(q);
    }
    return tokens.some(token => fullText.includes(token));
}

function getWordStem(word) {
    let w = normalizeText(word);
    if (w.length <= 3) {
        return w;
    }
    return w.replace(/(ами|ями|ого|ему|ыми|ими|ое|ее|ая|яя|ые|ие|ой|ей|ом|ем|ах|ях|ит|ет|ут|ют|ат|ят|у|ю|а|я|ы|и|е|о)$/, '');
}

function getExpandedStems(rawQuery) {
    const cleanQ = normalizeText(rawQuery).trim();
    const rawTokens = cleanQ.split(/\s+/).filter(t => t.length >= 2);
    const meaningful = rawTokens.filter(t => !stopWords.includes(t));
    const activeTokens = meaningful.length > 0 ? meaningful : rawTokens;

    return activeTokens.map(token => {
        const stem = getWordStem(token);
        const variants = new Set([token, stem]);
        Object.keys(symptomMap).forEach(key => {
            if (stem.startsWith(key) || key.startsWith(stem)) {
                symptomMap[key].forEach(syn => variants.add(syn));
            }
        });
        return Array.from(variants);
    });
}

function matchMedicineSmart(item, lang, rawQuery) {
    const q = normalizeText(rawQuery).trim();
    if (!q) {
        return true;
    }
    const data = item[lang];
    const searchableText = normalizeText(
        data.name + ' ' + data.sub + ' ' + data.info + ' ' + item.keys
    );

    if (searchableText.includes(q)) {
        return true;
    }

    const tokenGroups = getExpandedStems(rawQuery);
    if (tokenGroups.length === 0) {
        return true;
    }

    return tokenGroups.every(variants =>
        variants.some(v => v.length >= 2 && searchableText.includes(v))
    );
}

function getCombinedStems(rawQuery) {
    const cleanQ = normalizeText(rawQuery).trim();
    const rawTokens = cleanQ.split(/\s+/).filter(t => t.length >= 2);
    const meaningful = rawTokens.filter(t => !stopWords.includes(t) && t !== "очень" && t !== "помоги" && t !== "глазах");
    const activeTokens = meaningful.length > 0 ? meaningful : rawTokens;

    return activeTokens.map(token => {
        const stem = getWordStem(token);
        const variants = new Set([token, stem]);
        if (token.startsWith("темн") || token.startsWith("глаз")) {
            ["обморок", "головокружен", "давлен", "слабост"].forEach(s => variants.add(s));
        }
        if (token.startsWith("затыл")) {

        Object.keys(symptomMap).forEach(key => {
            if (stem.startsWith(key) || key.startsWith(stem)) {
                symptomMap[key].forEach(syn => variants.add(syn));
            }
        });
        return Array.from(variants);
    });
}

matchMedicineSmart = function(item, lang, rawQuery) {
    const q = normalizeText(rawQuery).trim();
    if (!q) return true;
    const data = item[lang];
    const searchableText = normalizeText(data.name + ' ' + data.sub + ' ' + data.info + ' ' + item.keys);

    if (searchableText.includes(q)) return true;

    const tokenGroups = getCombinedStems(rawQuery);
    if (tokenGroups.length === 0) return true;

    if (tokenGroups.length > 1) {
        return tokenGroups.some(variants =>
            variants.some(v => v.length >= 2 && searchableText.includes(v))
        );
    }
    return tokenGroups[0].some(v => v.length >= 2 && searchableText.includes(v));
};

(function() {
    function fillNuanceBox() {
        const titleEl = document.getElementById('med-name');
        const infoEl = document.getElementById('txt-info');
        const txtNuance = document.getElementById('txt-nuance');
        if (!titleEl || !txtNuance) return;

        const medName = titleEl.textContent.trim();
        const nameLow = medName.toLowerCase();
        const isEn = document.getElementById('btn-en') && document.getElementById('btn-en').classList.contains('active');
        const lang = isEn ? 'en' : 'ru';

        const divEl = document.getElementById('list-divider');
        const lblNuance = document.getElementById('lbl-nuance');
        if (divEl) divEl.textContent = isEn ? '📋 Select medication from list:' : '📋 Выберите препарат из списка:';
        if (lblNuance) lblNuance.textContent = isEn ? '⚠️ Special Conditions & Precautions' : '⚠️ Особые условия и нюансы приёма';

        if (typeof detailedNuances !== 'undefined') {
            for (const key in detailedNuances) {
                if (nameLow.includes(key)) {
                    txtNuance.textContent = detailedNuances[key][lang];
                    return;
                }
            }
        }

        const infoText = infoEl ? infoEl.textContent : '';
        if (lang === 'ru') {
            const parts = infoText.split('.').map(s => s.trim()).filter(Boolean);
            const warn = parts.find(s => /нельзя|запрещ|противопоказ|осторож|не превыш|врач/i.test(s));
            if (warn) {
                txtNuance.textContent = `Особое условие по применению «${medName}»: ${warn.toLowerCase()}. Не превышайте рекомендованную дозировку и проверьте срок годности перед приёмом.`;
            } else {
                txtNuance.textContent = `Особое условие по применению «${medName}»: принимайте строго по схеме, не сочетайте без назначения с алкоголем и похожими по действию лекарствами. Если симптомы не проходят за 2–3 дня — обратитесь к врачу.`;
            }
        } else {
            txtNuance.textContent = `Special condition for "${medName}": follow exact dosage intervals, avoid alcohol, and check expiration date before use.`;
        }
    }

    fillNuanceBox();
    const target = document.getElementById('med-name');
    if (target) {
        const obs = new MutationObserver(fillNuanceBox);
        obs.observe(target, { childList: true, characterData: true, subtree: true });
    }
    document.addEventListener('click', () => setTimeout(fillNuanceBox, 30));
})();

(function() {
    function updateClinicalReminder() {
        const titleEl = document.getElementById('med-name');
        const subEl = document.getElementById('med-sub');
        const discEl = document.getElementById('ui-disc');
        if (!titleEl || !discEl) return;

        const name = titleEl.textContent.trim();
        const sub = subEl ? subEl.textContent.toLowerCase() : '';
        const nameLow = name.toLowerCase();
        const isEn = document.getElementById('btn-en') && document.getElementById('btn-en').classList.contains('active');

        if (isEn) {
            discEl.textContent = `Important reminder for "${name}": most over-the-counter medications do not cure the underlying cause of a disease, they only relieve its symptoms. This service is not a doctor — consult a specialist if symptoms persist.`;
            return;
        }

        const isCausal = /антибиотик|противовирус|антибактериальн|амоксициллин|азитромицин|ингавирин|кагоцел|ацикловир|энтерофурил/i.test(nameLow + ' ' + sub);
        const isSupport = /витамин|магн|пробиотик|микрофлор|уход|заживлен|гигиен/i.test(nameLow + ' ' + sub);

        if (isCausal) {
            discEl.textContent = `Помните о препарате «${name}»: средство направлено на борьбу с возбудителем инфекции, но его должен назначать врач. Не прерывайте курс раньше времени и помните, что сайт не заменяет очный осмотр специалиста.`;

    updateClinicalReminder();
    const target = document.getElementById('med-name');
    if (target) {
        const obs = new MutationObserver(() => setTimeout(updateClinicalReminder, 15));

                txtNuance.textContent = `Особое условие для «${medName}»: рецептурный антибактериальный препарат. Применяется только по назначению врача при бактериальной инфекции, курс необходимо допить до конца.`;
            } else {
                txtNuance.textContent = `Особое условие для «${medName}»: соблюдайте точную дозировку и возрастные ограничения, не совмещайте с алкоголем и похожими по составу лекарствами. При отсутствии эффекта в течение 2–3 дней обратитесь к врачу.`;
            }
        }
    }

    getSmartFormNuance();
    const target = document.getElementById('med-name');
    if (target) {
        const obs = new MutationObserver(() => setTimeout(getSmartFormNuance, 35));
        obs.observe(target, { childList: true, characterData: true, subtree: true });
    }
    document.addEventListener('click', () => setTimeout(getSmartFormNuance, 50));
})();
</script>

<script>
(function() {
    const panels = document.querySelectorAll('.panel');
    if (panels.length < 2) return;

    const leftPanel = panels[0];
    const rightPanel = panels[1];

    const tabsBar = document.createElement('div');
    tabsBar.className = 'mobile-tabs';
    tabsBar.innerHTML = `
        <button class="mob-tab-btn active" id="tab-btn-search">🔍 Поиск и список</button>
        <button class="mob-tab-btn" id="tab-btn-info">📘 Инструкция</button>
    `;
    leftPanel.parentNode.insertBefore(tabsBar, leftPanel);

    const backBtn = document.createElement('button');
    backBtn.className = 'back-to-list-btn';
    backBtn.id = 'mob-back-btn';
    backBtn.textContent = '← Вернуться к выбору препарата';
    rightPanel.insertBefore(backBtn, rightPanel.firstChild);

    function showMobileTab(tabName) {
        const btnSearch = document.getElementById('tab-btn-search');
        const btnInfo = document.getElementById('tab-btn-info');
        if (window.innerWidth > 768) {
            leftPanel.classList.remove('mob-hidden');
            rightPanel.classList.remove('mob-hidden');
            return;
        }
        if (tabName === 'info') {
            leftPanel.classList.add('mob-hidden');
            rightPanel.classList.remove('mob-hidden');
            btnSearch.classList.remove('active');
            btnInfo.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            rightPanel.classList.add('mob-hidden');
            leftPanel.classList.remove('mob-hidden');
            btnInfo.classList.remove('active');
            btnSearch.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    document.getElementById('tab-btn-search').onclick = () => showMobileTab('search');
    document.getElementById('tab-btn-info').onclick = () => showMobileTab('info');
    backBtn.onclick = () => showMobileTab('search');

    const medList = document.getElementById('med-list');
    if (medList) {
        medList.addEventListener('click', function(e) {
            if (e.target.closest('.med-btn') && window.innerWidth <= 768) {
                setTimeout(() => showMobileTab('info'), 40);
            }
        });
    }

    function syncMobileLabels() {
        const isEn = document.getElementById('btn-en') && document.getElementById('btn-en').classList.contains('active');
        document.getElementById('tab-btn-search').textContent = isEn ? '🔍 Search & List' : '🔍 Поиск и список';
        document.getElementById('tab-btn-info').textContent = isEn ? '📘 Instruction' : '📘 Инструкция';
        backBtn.textContent = isEn ? '← Back to medicine list' : '← Вернуться к выбору препарата';
    }

    document.addEventListener('click', () => setTimeout(syncMobileLabels, 30));
    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) {
            leftPanel.classList.remove('mob-hidden');
            rightPanel.classList.remove('mob-hidden');
        }
    });

    if (window.innerWidth <= 768) {
        showMobileTab('search');
    }
})();
</script>

<script>
(function() {
    function safeSetText(id, text) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
    }

    function safeSetAttr(id, attr, val) {
        const el = document.getElementById(id);
        if (el) el.setAttribute(attr, val);
    }

    window.renderApp = function() {
        if (typeof medicines === 'undefined' || !medicines.length) return;
        if (selectedIdx >= medicines.length || selectedIdx < 0) selectedIdx = 0;

        const isEn = (typeof currentLang !== 'undefined' && currentLang === 'en');
        const lang = isEn ? 'en' : 'ru';
        const u = (typeof uiText !== 'undefined' && uiText[lang]) ? uiText[lang] : {
            title: isEn ? "🩺 MedGuide" : "🩺 МедГид",
            search: isEn ? "🔍 Medicine or symptom..." : "🔍 Препарат или симптом (голова, тошнит, горло)...",
            infoLabel: isEn ? "📘 Simple Instruction" : "📘 Доступная инструкция",
            howLabel: isEn ? "💊 How to take properly" : "💊 Как правильно пить"
        };

        const currentMed = medicines[selectedIdx][lang];
        const searchEl = document.getElementById('search-box');
        const rawQuery = searchEl ? searchEl.value : '';
        const cleanQ = typeof normalizeText === 'function' ? normalizeText(rawQuery).trim() : rawQuery.toLowerCase().trim();

        safeSetText('ui-title', u.title);
        safeSetAttr('search-box', 'placeholder', u.search);
        safeSetText('lbl-info', u.infoLabel);
        safeSetText('lbl-how', u.howLabel);
        safeSetText('med-name', currentMed.name);
        safeSetText('med-sub', currentMed.sub);
        safeSetText('txt-info', currentMed.info);
        safeSetText('txt-how', currentMed.how);

        const btnRu = document.getElementById('btn-ru');
        const btnEn = document.getElementById('btn-en');
        if (btnRu) btnRu.className = 'ctrl-btn' + (!isEn ? ' active' : '');
        if (btnEn) btnEn.className = 'ctrl-btn' + (isEn ? ' active' : '');

        const tBox = document.getElementById('triage-alert');
        if (tBox && typeof fullClinicalRules !== 'undefined') {
            const rule = fullClinicalRules.find(r => r.test.test(rawQuery));
            if (rule && cleanQ.length >= 2) {
                tBox.style.display = 'block';
                tBox.className = 'triage-alert' + (rule.urgent ? ' urgent' : '');
                tBox.textContent = rule[lang];
            } else {
                tBox.style.display = 'none';
            }
        }

        const listBox = document.getElementById('med-list');
        if (!listBox) return;
        listBox.innerHTML = '';
        let count = 0;

        medicines.forEach((item, index) => {
            let isMatch = true;
            if (cleanQ.length > 0) {
                if (typeof matchMedicineSmart === 'function') {
                    isMatch = matchMedicineSmart(item, lang, rawQuery);
                } else {
                    const data = item[lang];
                    const hay = (data.name + ' ' + data.info + ' ' + (item.keys || '')).toLowerCase();
                    isMatch = hay.includes(cleanQ);
                }
            }

            if (isMatch) {
                count++;
                const data = item[lang];
                const btn = document.createElement('button');
                btn.className = 'med-btn' + (index === selectedIdx ? ' active' : '');
                const titleHtml = (typeof highlightText === 'function') ? highlightText(data.name, rawQuery) : data.name;
                btn.innerHTML = '<span>' + titleHtml + '</span><span class="tag">' + data.tag + '</span>';
                btn.onclick = function() {
                    selectedIdx = index;
                    window.renderApp();
                };
                listBox.appendChild(btn);
            }
        });

        const banner = document.getElementById('symptom-banner');
        if (banner) {
            if (cleanQ.length >= 2) {
                banner.style.display = 'block';
                banner.textContent = count > 0
                    ? (isEn ? '🩺 Matches found: ' + count : '🩺 Найдено подходящих средств: ' + count)
                    : (isEn ? '⚠️ No matches found.' : '⚠️ Ничего не найдено. Попробуйте написать проще (например: голова, горло, живот).');
            } else {
                banner.style.display = 'none';
            }
        }
    };

    window.renderApp();
})();
</script>
